spring:
  application:
    name: help-desk-api
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:postgresql://localhost:5432/helpdesk
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    showsql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  expiration: ${JWT_EXPIRATION}
  key: ${JWT_KEY}